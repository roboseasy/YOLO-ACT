e-width="1.1"/><text x="105" y="240" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222">x1</text><rect x="150" y="214" width="90" height="40" rx="2" fill="#F4CCCC" stroke="#A61C00" stroke-width="1.1"/><text x="195" y="240" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222">y1</text><rect x="240" y="214" width="90" height="40" rx="2" fill="#F4CCCC" stroke="#A61C00" stroke-width="1.1"/><text x="285" y="240" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222">x2</text><rect x="330" y="214" width="90" height="40" rx="2" fill="#F4CCCC" stroke="#A61C00" stroke-width="1.1"/><text x="375" y="240" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222">y2</text><rect x="420" y="214" width="90" height="40" rx="2" fill="#F4CCCC" stroke="#A61C00" stroke-width="1.1"/><text x="465" y="240" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222">cx</text><rect x="510" y="214" width="90" height="40" rx="2" fill="#F4CCCC" stroke="#A61C00" stroke-width="1.1"/><text x="555" y="240" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222">cy</text><rect x="600" y="214" width="90" height="40" rx="2" fill="#F4CCCC" stroke="#A61C00" stroke-width="1.1"/><text x="645" y="240" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222">is_detected</text><text x="60" y="282" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222222">front · box · slot 0 — YOLO xyxyn (normalized 0–1), box center (cx, cy), is_detected = 1</text><text x="60" y="322" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222222">• Per class, keep the top-5 boxes by confidence (≥ the class threshold); slots are filled by larger area first, then left (smaller x1), then lower (larger y2).</text><text x="60" y="348" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222222">• Empty slots are all zeros with is_detected = 0. Values from the previous frame are never held.</text><text x="60" y="374" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222222">• b is not normalized by dataset statistics (IDENTITY). The BBox MLP computes  2b − 1 → Linear → GELU → Linear → one encoder token.</text></svg>